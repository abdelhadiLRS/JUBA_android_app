name: JUBA Android CI

on:
  push:
    branches: [ main, 'modernize/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [UserApp, StoreApp, ProviderApp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Validate Gradle wrapper
        working-directory: ${{ matrix.app }}
        run: chmod +x gradlew && ./gradlew --version

      - name: Build development debug APK
        working-directory: ${{ matrix.app }}
        run: ./gradlew assembleDevDebug --no-daemon --stacktrace --warning-mode all

      - name: Build production release APK
        working-directory: ${{ matrix.app }}
        run: ./gradlew assembleProdRelease --no-daemon --stacktrace --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dev-debug
          path: ${{ matrix.app }}/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-prod-release
          path: ${{ matrix.app }}/app/prod/release/*.apk
          if-no-files-found: error
