name: JUBA Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [UserApp, StoreApp, ProviderApp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle executable
        working-directory: ${{ matrix.app }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ matrix.app }}
        run: ./gradlew assembleDevDebug --no-daemon --stacktrace --refresh-dependencies
